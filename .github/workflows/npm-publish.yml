name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example, v0.3.2)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}

jobs:
  publish:
    name: Publish @nacho-labs/mcp-semantic-search
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Cache Transformers model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/.cache/mcp-semantic-search/transformers
          key: transformers-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Verify release tag matches package version
        run: |
          actual_tag="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$actual_tag"

      - run: npm ci
      # The immutable v0.3.2 tag uses CRLF formatting. Preserve formatting validation
      # while allowing the runner checkout's native line endings.
      - run: npx prettier --check --end-of-line auto .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: Run network MCP integration smoke
        run: npm run test:integration
        env:
          MCP_SEMANTIC_TEST_CACHE_DIR: ${{ runner.home }}/.cache/mcp-semantic-search/transformers
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
