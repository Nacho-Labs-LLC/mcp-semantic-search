name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @nacho-labs/mcp-semantic-search
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Cache Transformers model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/.cache/mcp-semantic-search/transformers
          key: transformers-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Verify release tag matches package version
        run: |
          test "${{ github.event.release.tag_name }}" = "v$(node -p \"require('./package.json').version\")"

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: Run network MCP integration smoke
        run: npm run test:integration
        env:
          MCP_SEMANTIC_TEST_CACHE_DIR: ${{ runner.home }}/.cache/mcp-semantic-search/transformers
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
