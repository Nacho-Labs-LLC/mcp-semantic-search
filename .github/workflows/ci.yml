name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache Transformers model artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mcp-semantic-search-model-cache
          key: transformers-${{ runner.os }}-all-MiniLM-L6-v2

      - run: npm ci
      - run: npx prettier --check --end-of-line auto .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: MCP integration tests (real model)
        run: npm run test:integration
        env:
          MCP_SEMANTIC_TEST_CACHE_DIR: ${{ runner.temp }}/mcp-semantic-search-model-cache
      - run: npm pack --dry-run
